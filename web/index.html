<script>
/**
 * Amou Music · Frontend Controller
 * Minimal, modular, tactile client architecture for audio hardware remote.
 */
(function() {
  'use strict';

  // --- 1. Configuration ---
  const CONFIG = {
    POLL_NORMAL_MS: 2000,
    POLL_MAX_MS: 8000,
    POLL_BACKOFF: 1.5,
    FADER_SUPPRESS_MS: 950,
    DEBOUNCE_FADER_MS: 80,
    REQUEST_TIMEOUT_MS: 4000
  };

  // --- 2. Haptic Feedback ---
  const Haptics = {
    tap() {
      if (navigator.vibrate) {
        try { navigator.vibrate(10); } catch (_) {}
      }
    },
    switch() {
      if (navigator.vibrate) {
        try { navigator.vibrate(20); } catch (_) {}
      }
    },
    action() {
      if (navigator.vibrate) {
        try { navigator.vibrate([16, 32, 16]); } catch (_) {}
      }
    }
  };

  // --- 3. API Communication Layer ---
  class AudioRemoteAPI {
    static async request(path, options = {}) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);

      try {
        const res = await fetch(path, {
          cache: 'no-store',
          headers: { 'Accept': 'application/json' },
          signal: controller.signal,
          ...options
        });
        clearTimeout(timer);

        let data = {};
        try { data = await res.json(); } catch (_) {}

        if (!res.ok) {
          const err = new Error(data.error || ("HTTP " + res.status));
          err.status = res.status;
          throw err;
        }
        return data;
      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') {
          const timeoutErr = new Error('请求超时，请检查服务状态');
          timeoutErr.status = 408;
          throw timeoutErr;
        }
        throw err;
      }
    }

    static getState() {
      return this.request('/api/state');
    }

    static setVolume(value) {
      return this.request('/api/volume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: Math.max(0, Math.min(1, value)) })
      });
    }

    static nudgeVolume(delta) {
      return this.request('/api/volume', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta })
      });
    }

    static setMute(muted) {
      return this.request('/api/mute', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ muted: Boolean(muted) })
      });
    }

    static playback(action) {
      return this.request('/api/playback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
    }
  }

  // --- 4. Observable State Store ---
  class RemoteStore {
    constructor() {
      this.state = {
        volume: 0,
        muted: false,
        device: '连接中…',
        metadata: null,
        status: 'connecting', // 'connected' | 'reconnecting' | 'offline'
        error: null
      };
      this.subscribers = new Set();
    }

    subscribe(fn) {
      this.subscribers.add(fn);
      fn(this.state);
      return () => this.subscribers.delete(fn);
    }

    update(patch) {
      this.state = { ...this.state, ...patch };
      this.subscribers.forEach(fn => fn(this.state));
    }

    get() {
      return this.state;
    }
  }

  /* Consecutive identical readings required before the play/pause glyph
     follows the server. Applies in BOTH directions -- see updatePlayIcon for
     why trusting "stopped" immediately was wrong. */
  const PLAY_STREAK_TO_TRUST = 2;

  /* Credit lines the player puts above the first sung line. They are kept,
     just de-emphasised -- they are part of the lyric, not decoration. */
  const CREDIT_RE = /^(作词|作曲|编曲|混音|录音|监制|出品|制作人|和声|母带|词|曲)\s*[:：]/;

  // --- 5. UI View & Controller ---
  class UIController {
    constructor(store, coordinator) {
      this.store = store;
      this.coordinator = coordinator;
      this.suppressFaderUntil = 0;
      /* Play/pause truth arrives seconds late: the media session graph only
         reflects a real toggle about 5s after the key press, so a naive
         reconcile makes the glyph bounce. Instead of a time-based mute window
         (the previous approach, which suppressed 2.5s and then snapped back
         anyway), the glyph follows the server only after two identical
         readings. See updatePlayIcon.

         playStreak starts one short of the threshold so the very first poll
         after page load can confirm immediately -- there is nothing to
         protect against yet. */
      this.playing = false;
      this.playRaw = false;
      this.playStreak = PLAY_STREAK_TO_TRUST - 1;
      /* Track identity as last rendered. Keyed off song id + lyric token so
         the lyric list is rebuilt only when it really changed -- rebuilding
         every poll would also throw away the scroll offset. */
      this.trackKey = null;
      this.lyricLines = [];
      this.lyricNodes = [];
      this.lyricIndex = -1;
      this.debounceTimer = null;
      this.toastTimer = null;

      this.els = {
        pilotBadge: document.getElementById('pilotBadge'),
        deviceName: document.getElementById('deviceName'),
        faderModule: document.getElementById('faderModule'),
        volumeNum: document.getElementById('volumeNum'),
        faderSlider: document.getElementById('faderSlider'),
        cutBtn: document.getElementById('cutBtn'),
        cutIcon: document.getElementById('cutIcon'),
        cutText: document.getElementById('cutText'),
        stepDown: document.getElementById('stepDown'),
        stepUp: document.getElementById('stepUp'),
        presets: document.querySelectorAll('.preset-key'),
        deckPrev: document.getElementById('deckPrev'),
        deckPlay: document.getElementById('deckPlay'),
        deckPlayIcon: document.getElementById('deckPlayIcon'),
        deckNext: document.getElementById('deckNext'),
        trackTitle: document.getElementById('trackTitle'),
        trackArtist: document.getElementById('trackArtist'),
        artFrame: document.getElementById('artFrame'),
        artCover: document.getElementById('artCover'),
        lyricCard: document.getElementById('lyricCard'),
        lyricTrack: document.getElementById('lyricTrack'),
        consoleToast: document.getElementById('consoleToast'),
        toastText: document.getElementById('toastText'),
        toastRetryBtn: document.getElementById('toastRetryBtn')
      };

      this.bindEvents();
      this.store.subscribe(state => this.render(state));
    }

    showToast(msg, onRetry = null) {
      this.els.toastText.textContent = msg;
      this.els.consoleToast.classList.add('show');

      if (onRetry) {
        this.els.toastRetryBtn.hidden = false;
        this.els.toastRetryBtn.onclick = () => {
          this.hideToast();
          onRetry();
        };
      } else {
        this.els.toastRetryBtn.hidden = true;
      }

      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => this.hideToast(), 4500);
    }

    hideToast() {
      clearTimeout(this.toastTimer);
      this.els.consoleToast.classList.remove('show');
    }

    render(state) {
      const pct = Math.round((state.volume || 0) * 100);

      // Connection Status & Pilot LED
      this.els.pilotBadge.className = 'pilot-badge ' + state.status;
      if (state.status === 'connected') {
        this.els.deviceName.textContent = state.device || '已连接';
      } else if (state.status === 'reconnecting') {
        this.els.deviceName.textContent = '重连中…';
      } else {
        this.els.deviceName.textContent = '已离线';
      }

      // Fader & Mute (CUT)
      this.els.volumeNum.textContent = isNaN(pct) ? '--' : pct;
      document.documentElement.style.setProperty('--fill-pct', pct + '%');
      this.els.faderModule.classList.toggle('is-muted', state.muted);

      if (Date.now() > this.suppressFaderUntil) {
        this.els.faderSlider.value = pct;
      }

      this.els.cutBtn.classList.toggle('active', state.muted);
      this.els.cutBtn.setAttribute('aria-checked', state.muted ? 'true' : 'false');
      this.els.cutText.textContent = state.muted ? '已静音' : '静音';
      this.updateCutIcon(state.muted, pct);

      // Play/pause glyph. Debounced inside updatePlayIcon, so the raw reading
      // is handed over unconditionally.
      this.updatePlayIcon(!!state.playing);

      // Preset buttons state
      this.els.presets.forEach(btn => {
        const val = Number(btn.dataset.preset);
        btn.classList.toggle('active', !state.muted && pct === val);
      });

      // Session Metadata
      if (state.metadata && state.metadata.title) {
        this.els.trackTitle.textContent = state.metadata.title;
        this.els.trackArtist.textContent = state.metadata.artist || '系统音频会话';
      } else {
        this.els.trackTitle.textContent = '全局系统音频会话';
        this.els.trackArtist.textContent = state.device ? ('输出设备: ' + state.device) : '网易云 / QQ音乐 / Spotify / 浏览器';
      }
      this.renderTrack(state.metadata);
    }

    /* Cover art and lyrics, both driven by the same metadata payload.

       They are split from the title block above because they behave
       differently: the title is cheap text, while the cover is a network
       request and the lyric list is a DOM rebuild. Both are keyed off the
       track identity so a 2s poll does not repeat that work. */
    renderTrack(meta) {
      const track = meta && meta.title ? meta : null;
      const key = track ? track.song_id + ':' + (track.lyric_token || '') : null;

      if (key !== this.trackKey) {
        this.trackKey = key;
        this.lyricLines = track ? (track.lyrics || []) : [];
        this.lyricNodes = [];
        this.lyricIndex = -1;
        this.renderLyrics(this.lyricLines);
        this.renderCover(track);
      }
      if (track) this.highlightLyric(track.position_ms || 0);
    }

    /* Fetches the cover once per track. A miss leaves the vinyl showing,
       which is the honest fallback: the player simply has not cached that
       album's art. */
    renderCover(track) {
      const img = this.els.artCover;
      const frame = this.els.artFrame;
      if (!track || !track.has_cover) {
        frame.classList.remove('has-cover');
        img.removeAttribute('src');
        return;
      }
      const url = '/api/cover?song_id=' + encodeURIComponent(track.song_id);
      if (img.getAttribute('src') === url) return;
      img.alt = track.title + (track.artist ? ' - ' + track.artist : '');
      img.onerror = () => {
        // 404 / no cached art: fall back to the disc permanently for this track.
        frame.classList.remove('has-cover');
        img.removeAttribute('src');
      };
      img.src = url;
      frame.classList.add('has-cover');
    }

    /* Builds the lyric list. Kept separate from highlighting so the two
       concerns stay separable: this one lays out the song once per track,
       `highlightLyric` only ever moves the window and swaps a class. */
    renderLyrics(lines) {
      const card = this.els.lyricCard;
      const track = this.els.lyricTrack;
      if (!lines || !lines.length) {
        card.hidden = true;
        track.textContent = '';
        this.lyricNodes = [];
        this.lyricIndex = -1;
        return;
      }
      card.hidden = false;
      track.textContent = '';
      /* Reset the offset before measuring: the previous song's position would
         otherwise be the starting transform for this one's first measurement. */
      track.style.transform = 'translateY(0)';
      const frag = document.createDocumentFragment();
      this.lyricNodes = lines.map((line, index) => {
        const el = document.createElement('p');
        el.className = 'lyric-line' + (CREDIT_RE.test(line[1]) ? ' is-credit' : '');
        el.textContent = line[1];
        el.dataset.index = String(index);
        frag.appendChild(el);
        return el;
      });
      track.appendChild(frag);
      this.lyricIndex = -1;
    }

    /* Slides the window so `index` sits on its top edge. Measured, not
       computed: a long English line wraps to two rows, so row height is not a
       constant and index * rowHeight would drift. offsetTop is relative to
       the track, which is the positioned ancestor of every line. */
    seekToLine(index) {
      const track = this.els.lyricTrack;
      const node = this.lyricNodes[index];
      /* Before the first timestamp there is no current line; hold the top of
         the song rather than jumping somewhere arbitrary. */
      const top = node ? node.offsetTop : 0;
      track.style.transform = 'translateY(' + (-top) + 'px)';
    }

    /* Marks the line the estimated position falls on. Binary search: the
       timeline is sorted, and a long lyric would otherwise be O(n) on every
       poll. */
    highlightLyric(positionMs) {
      const lines = this.lyricLines;
      if (!lines.length) return;
      let lo = 0, hi = lines.length - 1, found = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (lines[mid][0] <= positionMs) { found = mid; lo = mid + 1; } else { hi = mid - 1; }
      }
      if (found === this.lyricIndex) return;
      if (this.lyricIndex >= 0 && this.lyricNodes[this.lyricIndex]) {
        const prev = this.lyricNodes[this.lyricIndex];
        prev.classList.remove('is-current');
        prev.removeAttribute('aria-current');
      }
      this.lyricIndex = found;
      if (found >= 0 && this.lyricNodes[found]) {
        const next = this.lyricNodes[found];
        next.classList.add('is-current');
        next.setAttribute('aria-current', 'true');
      }
      this.seekToLine(Math.max(found, 0));
    }

    /* Play is a rounded triangle, pause two rounded bars. Both are drawn into
       the same 7..20 x 4..20 box so swapping them does not change the
       button's visual weight — same trick the skip glyphs use. */
    /* `raw` is the server's "a known media player is producing sound".

       Measured on NetEase Cloud Music, a real play/pause toggle takes roughly
       5 seconds to show up in the session graph — pausing does not flip the
       session to Inactive, the session objects simply disappear a few seconds
       later. So the reading genuinely disagrees with reality for several
       seconds after every press, in BOTH directions.

       The earlier logic debounced only the "playing" claim and trusted
       "stopped" immediately. That was asymmetric for no reason and produced a
       visible snap-back: pause the music, the icon flips to "play" instantly,
       then the 2.5s mute window expires while the graph still says Active and
       the icon jumps back to "pause" for a few seconds before finally settling.

       Requiring two identical readings either way removes the bounce without a
       time window: the optimistic flip on press sets playRaw to the expected
       value, so the lagging poll disagrees once (streak resets, nothing moves)
       and the second agreeing poll confirms it. */
    updatePlayIcon(raw) {
      if (raw === this.playRaw) {
        this.playStreak += 1;
      } else {
        this.playRaw = raw;
        this.playStreak = 1;
      }
      if (this.playStreak >= PLAY_STREAK_TO_TRUST) {
        this.setPlayIcon(this.playRaw);
      }
    }

    /* The actual glyph swap, deliberately ungated: the optimistic flip on press
       has to be able to show "playing" on a single reading, which the streak
       rule above would otherwise swallow. */
    setPlayIcon(playing) {
      if (playing === this.playing) return;
      this.playing = playing;
      const icon = this.els.deckPlayIcon;
      if (icon) {
        icon.innerHTML = playing
          ? '<rect x="7" y="4" width="4.4" height="16" rx="2.2"></rect><rect x="15.6" y="4" width="4.4" height="16" rx="2.2"></rect>'
          : '<polygon points="8.5 5.5 18.5 12 8.5 18.5" stroke="currentColor" stroke-width="3" stroke-linejoin="round"></polygon>';
      }
      if (this.els.deckPlay) {
        this.els.deckPlay.setAttribute('aria-label', playing ? '暂停' : '播放');
      }
    }

    updateCutIcon(isMuted, pct) {
      if (isMuted || pct === 0) {
        this.els.cutIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>';
      } else if (pct < 50) {
        this.els.cutIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
      } else {
        this.els.cutIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
      }
    }

    bindEvents() {
      // Manual sync on badge click
      this.els.pilotBadge.addEventListener('click', () => {
        Haptics.tap();
        this.coordinator.pollNow();
      });

      // Continuous Fader
      this.els.faderSlider.addEventListener('input', () => {
        const pct = Number(this.els.faderSlider.value);
        this.suppressFaderUntil = Date.now() + CONFIG.FADER_SUPPRESS_MS;

        // Immediate visual feedback
        this.els.volumeNum.textContent = pct;
        document.documentElement.style.setProperty('--fill-pct', pct + '%');
        this.els.faderModule.classList.remove('is-muted');

        clearTimeout(this.debounceTimer);
        this.debounceTimer = setTimeout(async () => {
          try {
            const newState = await AudioRemoteAPI.setVolume(pct / 100);
            this.store.update({ ...newState, status: 'connected' });
          } catch (err) {
            this.showToast(err.message || '调节音量失败', () => this.coordinator.pollNow());
            this.coordinator.pollNow();
          }
        }, CONFIG.DEBOUNCE_FADER_MS);
      });

      // Nudge Steps
      this.els.stepDown.addEventListener('click', async () => {
        Haptics.tap();
        this.suppressFaderUntil = Date.now() + CONFIG.FADER_SUPPRESS_MS;
        try {
          const newState = await AudioRemoteAPI.nudgeVolume(-5);
          this.store.update({ ...newState, status: 'connected' });
        } catch (err) {
          this.showToast(err.message || '音量微调失败');
        }
      });

      this.els.stepUp.addEventListener('click', async () => {
        Haptics.tap();
        this.suppressFaderUntil = Date.now() + CONFIG.FADER_SUPPRESS_MS;
        try {
          const newState = await AudioRemoteAPI.nudgeVolume(5);
          this.store.update({ ...newState, status: 'connected' });
        } catch (err) {
          this.showToast(err.message || '音量微调失败');
        }
      });

      // Monitor Presets
      this.els.presets.forEach(btn => {
        btn.addEventListener('click', async () => {
          const val = Number(btn.dataset.preset);
          Haptics.switch();
          this.suppressFaderUntil = Date.now() + CONFIG.FADER_SUPPRESS_MS;
          try {
            const newState = await AudioRemoteAPI.setVolume(val / 100);
            this.store.update({ ...newState, status: 'connected' });
          } catch (err) {
            this.showToast(err.message || '设置预设音量失败');
          }
        });
      });

      // Mute (CUT) Switch
      this.els.cutBtn.addEventListener('click', async () => {
        Haptics.switch();
        const isMuted = this.store.get().muted;
        try {
          const newState = await AudioRemoteAPI.setMute(!isMuted);
          this.store.update({ ...newState, status: 'connected' });
        } catch (err) {
          this.showToast(err.message || '静音操作失败');
        }
      });

      // Deck Transport Keys
      const bindDeckKey = (btnEl, action) => {
        btnEl.addEventListener('click', async () => {
          Haptics.action();
          if (action === 'play_pause') {
            // Flip now rather than after the next poll: the session graph lags
            // a real toggle by seconds, so waiting would feel unresponsive.
            // playRaw is seeded with the expected value and the streak with 1,
            // so the first genuinely agreeing poll confirms the guess and a
            // disagreeing one merely resets — no snap-back either way.
            const expected = !this.playing;
            this.setPlayIcon(expected);
            this.playRaw = expected;
            this.playStreak = 1;
          }
          try {
            await AudioRemoteAPI.playback(action);
          } catch (err) {
            this.showToast(err.message || '发送按键失败', () => this.coordinator.pollNow());
          }
        });
      };

      bindDeckKey(this.els.deckPrev, 'prev');
      bindDeckKey(this.els.deckPlay, 'play_pause');
      bindDeckKey(this.els.deckNext, 'next');
    }
  }

  // --- 6. Polling & Connection Coordinator ---
  class ConnectionCoordinator {
    constructor(store) {
      this.store = store;
      this.interval = CONFIG.POLL_NORMAL_MS;
      this.timer = null;
      this.ui = null;
    }

    setUI(ui) {
      this.ui = ui;
    }

    async pollNow() {
      clearTimeout(this.timer);
      try {
        const state = await AudioRemoteAPI.getState();
        this.interval = CONFIG.POLL_NORMAL_MS;
        this.store.update({ ...state, status: 'connected', error: null });
        if (this.ui) this.ui.hideToast();
      } catch (err) {
        const wasConnected = this.store.get().status === 'connected';
        this.interval = Math.min(CONFIG.POLL_MAX_MS, this.interval * CONFIG.POLL_BACKOFF);
        this.store.update({
          status: wasConnected ? 'reconnecting' : 'offline',
          error: err
        });
        if (this.ui) {
          const hint = err.status === 503 ? '声卡设备不可用' : '请确认电脑端服务正在运行';
          this.ui.showToast(err.message + ' (' + hint + ')', () => this.pollNow());
        }
      } finally {
        this.schedule();
      }
    }

    schedule() {
      clearTimeout(this.timer);
      if (document.visibilityState === 'visible') {
        this.timer = setTimeout(() => this.pollNow(), this.interval);
      }
    }

    init() {
      this.pollNow();

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          this.interval = CONFIG.POLL_NORMAL_MS;
          this.pollNow();
        } else {
          clearTimeout(this.timer);
        }
      });

      window.addEventListener('online', () => {
        this.interval = CONFIG.POLL_NORMAL_MS;
        this.pollNow();
      });

      window.addEventListener('offline', () => {
        this.store.update({ status: 'offline' });
      });
    }
  }

  // --- 7. Initialization ---
  const store = new RemoteStore();
  const coordinator = new ConnectionCoordinator(store);
  const ui = new UIController(store, coordinator);
  coordinator.setUI(ui);
  coordinator.init();
})();
</script>

<script>
/* Theme: single owner of the resolved palette.
   Chooses light | dark | auto, writes the concrete value to data-theme (which
   is the only place the dark tokens live), and keeps the three browser-facing
   metas in sync. The inline script in <head> already set data-theme before
   first paint, so this module is idempotent on load. */
window.AmuTheme = (function () {
  'use strict';

  var KEY = 'amou.settings.theme';
  var root = document.documentElement;
  var schemeMeta = document.getElementById('colorSchemeMeta');
  var colorMeta = document.getElementById('themeColorMeta');
  var barMeta = document.getElementById('statusBarStyle');
  var sysDark = window.matchMedia('(prefers-color-scheme: dark)');
  var listeners = [];

  function choice() {
    try {
      var v = localStorage.getItem(KEY);
      return (v === 'light' || v === 'dark') ? v : 'auto';
    } catch (e) { return 'auto'; }
  }

  function resolve(c) {
    if (c === 'dark' || c === 'light') return c;
    return sysDark.matches ? 'dark' : 'light';
  }

  /* theme-color must be a RESOLVED colour, but getComputedStyle on a custom
     property returns the substituted token stream — --water-base still spells
     out calc() and clamp(), which is not a valid colour and would be ignored.
     Painting it onto a throwaway element and reading background-color forces
     the engine to evaluate the whole expression. The probe is created once
     and reused, because this runs on every accent-slider frame. */
  var probe = null;

  function syncChrome(r) {
    if (!colorMeta) return;
    if (!probe && document.body) {
      probe = document.createElement('span');
      probe.setAttribute('aria-hidden', 'true');
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:0;height:0;pointer-events:none';
      document.body.appendChild(probe);
    }
    if (!probe) return;
    probe.style.backgroundColor = 'var(--water-base)';
    var v = getComputedStyle(probe).backgroundColor;
    if (v && v !== 'rgba(0, 0, 0, 0)' && v !== 'transparent') colorMeta.setAttribute('content', v);
  }

  function paint(c) {
    var r = resolve(c);
    root.setAttribute('data-theme', r);
    if (schemeMeta) schemeMeta.setAttribute('content', r);
    /* Read the RESOLVED --water-base rather than hardcoding a green: that
       token already derives from --accent-h, so the browser chrome follows
       the accent instead of staying emerald. */
    syncChrome(r);
    /* black-translucent renders light glyphs, so it is the dark-canvas value. */
    if (barMeta) barMeta.setAttribute('content', r === 'dark' ? 'black-translucent' : 'default');
    for (var i = 0; i < listeners.length; i++) listeners[i](c, r);
  }

  function set(c) {
    var v = (c === 'light' || c === 'dark') ? c : 'auto';
    try { localStorage.setItem(KEY, v); } catch (e) { /* private mode */ }
    paint(v);
  }

  function onChange(fn) { listeners.push(fn); }

  function onSystemChange() {
    /* Only meaningful while the user has not pinned a side. */
    if (choice() === 'auto') paint('auto');
  }

  paint(choice());
  if (sysDark.addEventListener) sysDark.addEventListener('change', onSystemChange);
  else if (sysDark.addListener) sysDark.addListener(onSystemChange);

  return { choice: choice, set: set, onChange: onChange, resolve: resolve, syncChrome: syncChrome };
})();
</script>


<script>
/* Motion layer, built on GSAP core.
   Everything here is progressive enhancement: if gsap.min.js failed to load,
   the <gsap-driven> class is never added, the CSS transitions stay in charge
   and the page behaves exactly as before. */
(function () {
  'use strict';

  var g = window.gsap;
  if (!g) return;

  var doc = document.documentElement;
  doc.classList.add('gsap-driven');
  g.defaults({ duration: 0.5, ease: 'power3.out' });

  var sheet = document.getElementById('settingsSheet');
  var backdrop = document.getElementById('sheetBackdrop');
  var rows = document.querySelectorAll('.setting-row');
  var volNum = document.getElementById('volumeNum');
  var motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var mm = g.matchMedia();
  var played = false;

  /* 1. Entrance. Runs once; a user who turns reduced motion off later should
        not get the whole page re-animated under them. */
  mm.add('(prefers-reduced-motion: no-preference)', function () {
    if (played) return;
    played = true;
    g.timeline({ defaults: { ease: 'power3.out' } })
      .from('.topbar', { y: -14, autoAlpha: 0, duration: 0.5 })
      .from('.art', { y: 24, autoAlpha: 0, duration: 0.65 }, '-=0.32')
      .from('.controls > *', { y: 18, autoAlpha: 0, duration: 0.5, stagger: 0.06 }, '-=0.42')
      .from('.footnote', { autoAlpha: 0, duration: 0.4 }, '-=0.28');
  });

  /* 2. Volume readout roll. Observed rather than hooked into the controller so
        the main UIController layer stays untouched. */
  if (volNum && window.MutationObserver) {
    var last = null;
    new MutationObserver(function () {
      var txt = volNum.textContent;
      if (txt === last) return;
      var first = last === null;
      last = txt;
      if (first || motion.matches) return;
      g.fromTo(volNum,
        { y: -9, autoAlpha: 0.25 },
        { y: 0, autoAlpha: 1, duration: 0.3, ease: 'power2.out', overwrite: 'auto' });
    }).observe(volNum, { childList: true, characterData: true, subtree: true });
  }

  /* 3. Press feedback. quickTo reuses one tween per element instead of
        building a new one per press, and the release carries a little
        overshoot so it reads as sprung rather than mechanical. */
  mm.add('(prefers-reduced-motion: no-preference)', function () {
    var nodes = document.querySelectorAll(
      '.glyph, .mute-button, .preset-key, .preset-step, .icon-button, .seg, .sheet-done');
    for (var i = 0; i < nodes.length; i++) {
      (function (el) {
        /* scaleX/scaleY, never the combined `scale` shorthand: quickTo re-seeds
           its tween on every call, and GSAP refuses to reset a merged
           transform property that way ("scale not eligible for reset"). */
        var opt = { duration: 0.12, ease: 'power3.out' };
        var back = { duration: 0.4, ease: 'back.out(2.4)' };
        var downX = g.quickTo(el, 'scaleX', opt), downY = g.quickTo(el, 'scaleY', opt);
        var upX = g.quickTo(el, 'scaleX', back), upY = g.quickTo(el, 'scaleY', back);
        var release = function () { upX(1); upY(1); };
        el.addEventListener('pointerdown', function () { downX(0.9); downY(0.9); });
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('pointerleave', release);
      })(nodes[i]);
    }
  });

  /* 4. Water flow. GSAP is now the ONLY writer of the backdrop's motion:
     dx/dy on the feOffset primitive, plus the layer's own drift transform.
     Speed is applied through timeScale(), so dragging the slider scales the
     timeline continuously — re-deriving a `dur` on every input would restart
     the tween and visibly jump. */
  var feOffset = document.querySelector('feOffset');
  var waterSvg = document.querySelector('.water-svg');
  var waterTweens = [];
  var waterSpeed = 1;

  if (feOffset) {
    waterTweens.push(
      g.to(feOffset, { attr: { dx: 210 }, duration: 9, ease: 'sine.inOut', repeat: -1, yoyo: true }),
      g.to(feOffset, { attr: { dy: 95 }, duration: 11.5, ease: 'sine.inOut', repeat: -1, yoyo: true })
    );
  }
  if (waterSvg) {
    waterTweens.push(
      g.to(waterSvg, { xPercent: -1.8, yPercent: 1.6, scale: 1.05,
                       duration: 40, ease: 'sine.inOut', repeat: -1, yoyo: true })
    );
  }

  function setWater(speed) {
    waterSpeed = speed;
    var still = motion.matches;
    for (var w = 0; w < waterTweens.length; w++) {
      if (still || speed <= 0) {
        waterTweens[w].pause();
      } else {
        waterTweens[w].timeScale(speed).play();
      }
    }
  }

  var onMotionChange = function () { setWater(waterSpeed); };
  if (motion.addEventListener) motion.addEventListener('change', onMotionChange);
  else if (motion.addListener) motion.addListener(onMotionChange);

  /* 5. Vinyl. A record turns at CONSTANT angular velocity, so this is the one
        tween in the file with ease 'none' — any easing would read as the disc
        accelerating and braking once per revolution.

        32s per turn, about 1.9rpm. Real vinyl is 33 1/3 (1.8s), but this is a
        full-bleed backdrop element and the eye tracks the highlight rather
        than the disc: 2.6s read as restless, then 8s and 16s were still
        dialled down. 32s advances 11.25 deg per second, which over a two
        second glance is a clearly visible 22.5 deg — slow enough to be
        ambient, fast enough that it never looks frozen. Duration is the knob
        if it needs tuning again.

        Note what does NOT move: the grooves, the label and the spindle are all
        radially symmetric, so the rotation is legible only through the conic
        sheen on top. That is the real-world behaviour too — a record's light
        highlight is what tells you the disc is turning.

        ONE owner for `transform`. The stylesheet centres the disc with
        `inset:0; margin:auto` and never writes a transform, so the tween only
        has to name `rotation`. The earlier version centred in CSS *and* asked
        GSAP for `xPercent/yPercent: -50` -- two centring channels that agree
        only as long as both are right, which is precisely the coupling that
        produced drift. */
  var vinyl = document.querySelector('.vinyl');
  var artCover = document.querySelector('.art-cover');

  mm.add('(prefers-reduced-motion: no-preference)', function () {
    /* A factory, not a shared literal: both discs get their own vars object so
       neither tween can alias state into the other. `transformOrigin` is named
       explicitly -- the disc turns about its own centre rather than relying on
       an inherited default. */
    var spin = function () {
      return {
        rotation: 360,
        transformOrigin: '50% 50%',
        duration: 32,
        ease: 'none',
        repeat: -1
      };
    };
    if (vinyl) g.to(vinyl, spin());
    /* The artwork is a picture disc, so it turns with the record. Same
       duration, ease and start time as .vinyl, so the two stay locked through
       the cross-fade between them. Unlike the vinyl, whose rotation is only
       legible through its conic sheen, the cover is not radially symmetric —
       its turn is plainly visible, which is what sells it as a spinning disc. */
    if (artCover) g.to(artCover, spin());
  });
  /* 5. Sheet. A timeline so the backdrop, the panel and the rows move as one
        gesture instead of three transitions that merely overlap. */
  window.AmuAnim = {
    water: function (speed) { setWater(speed); },
    sheet: function (open, done) {
      if (!sheet || !backdrop) { if (done) done(); return; }
      var finish = function () { if (done) done(); };
      var still = motion.matches;

      /* The stylesheet's `transform: translateY(100%)` is a PERCENTAGE, and
         GSAP resolves it against the element height into a baked PIXEL `y` on
         first parse — leaving yPercent at 0. Animating yPercent alone then
         zeroes the wrong component and the panel never moves. So both `y` and
         `yPercent` are set explicitly from the measured height here. */
      var h = sheet.offsetHeight;

      if (open) {
        sheet.hidden = false;
        backdrop.hidden = false;
        var tl = g.timeline({ onComplete: finish });
        tl.set(backdrop, { autoAlpha: 0 })
          .set(sheet, { yPercent: 0, y: h });
        if (still) {
          tl.set(backdrop, { autoAlpha: 1 }, 0).set(sheet, { y: 0 }, 0);
        } else {
          tl.to(backdrop, { autoAlpha: 1, duration: 0.3, ease: 'power2.out' }, 0)
            .to(sheet, { y: 0, duration: 0.46, ease: 'power4.out' }, 0)
            .from(rows, { y: 14, autoAlpha: 0, duration: 0.32, stagger: 0.055, ease: 'power2.out' }, 0.14);
        }
      } else {
        var tl2 = g.timeline({ onComplete: finish });
        if (still) {
          tl2.set(sheet, { y: h }, 0).set(backdrop, { autoAlpha: 0 }, 0);
        } else {
          tl2.to(sheet, { y: h, duration: 0.34, ease: 'power3.in' }, 0)
            .to(backdrop, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, 0.06);
        }
      }
    }
  };
})();
</script>
<script>
/* Settings: background flow speed.
   Kept in its own block so the main UIController/Store layer stays untouched.
   Speed multiplies every period in the water chain; 0 parks the background. */
(function () {
  'use strict';

  var KEY = 'amou.settings.bgSpeed';
  var DEF = 1;

  var btn = document.getElementById('settingsBtn');
  var sheet = document.getElementById('settingsSheet');
  var backdrop = document.getElementById('sheetBackdrop');
  var doneBtn = document.getElementById('settingsDone');
  /* The scrolling region lives inside the sheet; reopening must start at the
     top, otherwise returning from a mid-scroll dismissal is disorienting. */
  var scrollEl = document.querySelector('.sheet-scroll');
  var slider = document.getElementById('bgSpeed');

  var readout = document.getElementById('bgSpeedValue');
  var segs = document.querySelectorAll('[data-theme-choice]');
  var Theme = window.AmuTheme;
  var outputSel = document.getElementById('outputSelect');
  var hueEl = document.getElementById('accentHue');
  var satEl = document.getElementById('accentSat');
  var lightEl = document.getElementById('accentLight');
  var hueOut = document.getElementById('accentHueVal');
  var satOut = document.getElementById('accentSatVal');
  var lightOut = document.getElementById('accentLightVal');
  var outputNote = document.getElementById('outputNote');
  var motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var timer = null;

  function readSpeed() {
    try {
      var raw = localStorage.getItem(KEY);
      var n = raw === null ? NaN : Number(raw);
      return isFinite(n) && n >= 0 ? n : DEF;
    } catch (e) { return DEF; }
  }

  function writeSpeed(n) {
    try { localStorage.setItem(KEY, String(n)); } catch (e) { /* private mode */ }
  }

  /* ---- water parameters ------------------------------------------------
     Four axes of the fluid backdrop. Warp and vignette are cheap — a filter
     re-run and a CSS custom property — so they track the drag live.
     baseFrequency and numOctaves force feTurbulence to REGENERATE the whole
     noise field, which is exactly the cost the "build the field once" design
     in the stylesheet avoids; those two only write on pointer-release, while
     their readouts still follow the drag so the control never feels dead. */
  var waterNoise = document.getElementById('waterNoise');
  var waterWarpNode = document.getElementById('waterWarp');
  var warpEl = document.getElementById('waterWarpSlider');
  var rippleEl = document.getElementById('waterRippleSlider');
  var octavesEl = document.getElementById('waterOctavesSlider');
  var vignetteEl = document.getElementById('waterVignetteSlider');
  var warpOut = document.getElementById('waterWarpValue');
  var rippleOut = document.getElementById('waterRippleValue');
  var octavesOut = document.getElementById('waterOctavesValue');
  var vignetteOut = document.getElementById('waterVignetteValue');

  var WARP_DEF = 100, RIPPLE_DEF = 50, OCTAVES_DEF = 2, VIGNETTE_DEF = 100;
  var WARP_BASE = 130;                            /* feDisplacementMap@scale as authored */
  var FREQ_X = 0.0052, FREQ_Y = 0.0071;          /* feTurbulence@baseFrequency as authored */

  function readWater(key, def, lo, hi) {
    try {
      var raw = localStorage.getItem(key);
      var n = raw === null ? NaN : Number(raw);
      return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : def;
    } catch (e) { return def; }
  }

  function writeWater(key, n) {
    try { localStorage.setItem(key, String(n)); } catch (e) { /* private mode */ }
  }

  function applyWarp(pct) {
    if (warpEl) warpEl.value = String(pct);
    if (warpOut) warpOut.textContent = Math.round(pct) + '%';
    if (waterWarpNode) waterWarpNode.setAttribute('scale', WARP_BASE * pct / 100);
  }

  /* Exponential, so both ends sit equally far from the authored value and
     50% is exactly 1x — the shipped 0.0052 / 0.0071. A linear map would
     make the fine end far too noisy and the coarse end barely different. */
  function applyRipple(pct) {
    if (rippleEl) rippleEl.value = String(pct);
    if (rippleOut) rippleOut.textContent = Math.round(pct) + '%';
    if (waterNoise) {
      var m = Math.pow(2, ((pct - 50) / 50) * 1.5);
      waterNoise.setAttribute('baseFrequency', (FREQ_X * m) + ' ' + (FREQ_Y * m));
    }
  }

  function applyOctaves(n) {
    if (octavesEl) octavesEl.value = String(n);
    if (octavesOut) octavesOut.textContent = String(n);
    if (waterNoise) waterNoise.setAttribute('numOctaves', String(n));
  }

  function applyVignette(pct) {
    if (vignetteEl) vignetteEl.value = String(pct);
    if (vignetteOut) vignetteOut.textContent = Math.round(pct) + '%';
    var el = document.documentElement;
    if (pct === VIGNETTE_DEF) el.style.removeProperty('--vig-k');
    else el.style.setProperty('--vig-k', String(pct / 100));
  }

  /* Cheap pair: live on every input frame, persisted on release. */
  if (warpEl) {
    warpEl.addEventListener('input', function () { applyWarp(Number(warpEl.value)); });
    warpEl.addEventListener('change', function () {
      writeWater('amou.settings.waterWarp', Number(warpEl.value));
    });
  }
  if (vignetteEl) {
    vignetteEl.addEventListener('input', function () { applyVignette(Number(vignetteEl.value)); });
    vignetteEl.addEventListener('change', function () {
      writeWater('amou.settings.waterVignette', Number(vignetteEl.value));
    });
  }

  /* Expensive pair: readout follows the drag, the attribute waits. */
  if (rippleEl) {
    rippleEl.addEventListener('input', function () {
      if (rippleOut) rippleOut.textContent = Math.round(Number(rippleEl.value)) + '%';
    });
    rippleEl.addEventListener('change', function () {
      var v = Number(rippleEl.value);
      applyRipple(v);
      writeWater('amou.settings.waterRipple', v);
    });
  }
  if (octavesEl) {
    octavesEl.addEventListener('input', function () {
      if (octavesOut) octavesOut.textContent = String(octavesEl.value);
    });
    octavesEl.addEventListener('change', function () {
      var v = Number(octavesEl.value);
      applyOctaves(v);
      writeWater('amou.settings.waterOctaves', v);
    });
  }

  function restoreWater() {
    applyWarp(readWater('amou.settings.waterWarp', WARP_DEF, 0, 300));
    applyRipple(readWater('amou.settings.waterRipple', RIPPLE_DEF, 0, 100));
    applyOctaves(readWater('amou.settings.waterOctaves', OCTAVES_DEF, 1, 4));
    applyVignette(readWater('amou.settings.waterVignette', VIGNETTE_DEF, 0, 200));
  }
  /* The motion layer owns the backdrop now. Without GSAP there is nothing to
     drive (SMIL was removed to avoid two writers on one attribute), so the
     gradient simply stays static — the CSS keyframe drift still runs because
     the gsap-driven class is never added. */
  function apply(speed) {
    if (window.AmuAnim) window.AmuAnim.water(speed);
  }

  /* ---- output device ------------------------------------------------- */
  function api(path, body) {
    return fetch(path, {
      cache: 'no-store',
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      });
    });
  }

  function loadOutputs() {
    if (!outputSel) return;
    outputSel.disabled = true;
    outputSel.textContent = '读取中…';
    api('/api/outputs').then(function (data) {
      outputSel.textContent = '';
      (data.outputs || []).forEach(function (item) {
        var opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.name;
        if (item.current) opt.selected = true;
        outputSel.appendChild(opt);
      });
      if (!(data.outputs || []).length) {
        outputSel.textContent = '没有可用的输出设备';
      }
      outputSel.disabled = false;
    }).catch(function (err) {
      outputSel.textContent = '读取失败';
      outputSel.disabled = true;
      if (outputNote) outputNote.textContent = err.message || '读取输出设备失败';
    }).then(function () {
      if (outputNote) {
        outputNote.textContent = '切换会同时改写系统三种默认角色';
      }
    });
  }

  if (outputSel) {
    outputSel.addEventListener('change', function () {
      var id = outputSel.value;
      if (!id) return;
      outputSel.disabled = true;
      api('/api/output', { id: id }).then(function () {
        if (outputNote) outputNote.textContent = '已切换，正在同步音量…';
      }).catch(function (err) {
        if (outputNote) outputNote.textContent = err.message || '切换失败';
      }).then(function () {
        outputSel.disabled = false;
        loadOutputs();
      });
    });
  }

  /* ---- accent colour (HSL) ------------------------------------------- */
  var root = document.documentElement;
  var acc = { h: hueEl, s: satEl, l: lightEl };
  var accOut = { h: hueOut, s: satOut, l: lightOut };
  var ACC_KEY = 'amou.settings.accent';

  function cssAccent() {
    var cs = getComputedStyle(root);
    return {
      h: parseFloat(cs.getPropertyValue('--accent-h')) || 150,
      s: parseFloat(cs.getPropertyValue('--accent-s')) || 85,
      l: parseFloat(cs.getPropertyValue('--accent-l')) || 29
    };
  }

  /* s and l arrive from the sliders as PERCENTAGES (0-100); this converts to
     the 0-1 fractions the formula needs. Getting this wrong silently emits
     garbage hex, which previously corrupted the favicon data URI. */
  function hslToHex(h, sPct, lPct) {
    var s = sPct / 100, l = lPct / 100;
    var a = s * Math.min(l, 1 - l);
    var f = function (n) {
      var k = (n + h / 30) % 12;
      var c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
      return Math.round(255 * c).toString(16).padStart(2, '0');
    };
    return (f(0) + f(8) + f(4)).toUpperCase();
  }

  function paintAccent(a, custom) {
    root.style.setProperty('--accent-h', a.h);
    var hex = hslToHex(a.h, a.s, a.l);
    var icon = document.getElementById('favicon');
    if (icon && /^[0-9A-F]{6}$/.test(hex)) {
      icon.setAttribute('href', icon.getAttribute('href').replace(/%23[0-9A-Fa-f]{6}/, '%23' + hex));
    }
    root.style.setProperty('--accent-s', a.s + '%');
    root.style.setProperty('--accent-l', a.l + '%');
    /* Keep the mobile browser chrome in step with the accent. The theme module
       owns that and already does it on theme change; the accent sliders bypass
       the theme module, so without this the address bar keeps whatever colour
       was painted at load. */
    if (Theme && Theme.syncChrome) Theme.syncChrome();
    acc.h.value = String(a.h);
    acc.s.value = String(a.s);
    acc.l.value = String(a.l);
    accOut.h.textContent = Math.round(a.h) + '°';
    accOut.s.textContent = Math.round(a.s) + '%';
    accOut.l.textContent = Math.round(a.l) + '%';
    // Saturation and lightness tracks preview the space they navigate.
    acc.s.style.setProperty('--accent-track',
      'linear-gradient(to right, hsl(' + a.h + ' 0% ' + a.l + '%), hsl(' + a.h + ' 100% ' + a.l + '%))');
    acc.l.style.setProperty('--accent-track',
      'linear-gradient(to right, #000, hsl(' + a.h + ' ' + a.s + '% 50%), #fff)');
    if (custom) {
      try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) { /* private mode */ }
    }
  }

  function currentAccent() {
    return {
      h: Number(acc.h.value), s: Number(acc.s.value), l: Number(acc.l.value)
    };
  }

  function bindAccent(el, field) {
    if (!el) return;
    el.addEventListener('input', function () {
      var a = currentAccent();
      paintAccent(a, true);
    });
  }
  bindAccent(acc.h); bindAccent(acc.s); bindAccent(acc.l);

  function restoreAccent() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(ACC_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && typeof saved === 'object') {
      paintAccent({
        h: Number(saved.h) || 150, s: Number(saved.s) || 85, l: Number(saved.l) || 29
      }, true);
    } else {
      /* Never customised: follow the active theme's own defaults. */
      root.style.removeProperty('--accent-h');
      root.style.removeProperty('--accent-s');
      root.style.removeProperty('--accent-l');
      var d = cssAccent();
      paintAccent(d, false);
    }
  }

  if (Theme && Theme.onChange) {
    Theme.onChange(function () {
      var saved = null;
      try { saved = localStorage.getItem(ACC_KEY); } catch (e) { saved = null; }
      if (!saved) restoreAccent();
    });
  }

  function sync() {
    var speed = readSpeed();
    if (slider) slider.value = String(speed * 100);
    if (readout) readout.textContent = Math.round(speed * 100) + '%';
    apply(speed);
    restoreWater();
    syncTheme();
  }

  function syncTheme() {
    if (!Theme) return;
    var current = Theme.choice();
    for (var i = 0; i < segs.length; i++) {
      segs[i].setAttribute('aria-checked', segs[i].dataset.themeChoice === current ? 'true' : 'false');
    }
  }

  for (var s = 0; s < segs.length; s++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        if (!Theme) return;
        Theme.set(btn.dataset.themeChoice);
        syncTheme();
      });
    })(segs[s]);
  }

  if (slider) {
    slider.addEventListener('input', function () {
      var speed = Number(slider.value) / 100;
      if (readout) readout.textContent = Math.round(speed * 100) + '%';
      apply(speed);
      clearTimeout(timer);
      timer = setTimeout(function () { writeSpeed(speed); }, 200);
    });
  }

  function open() {
    if (!sheet || !backdrop) return;
    if (window.AmuAnim) {
      window.AmuAnim.sheet(true);
    } else {
      sheet.hidden = false;
      backdrop.hidden = false;
      /* Force a reflow so the transition has a start state to animate from. */
      void sheet.offsetWidth;
      sheet.classList.add('show');
      backdrop.classList.add('show');
    }
    if (scrollEl) scrollEl.scrollTop = 0;
    if (sheet) sheet.focus();
    loadOutputs();
  }

  function close() {
    if (!sheet || !backdrop) return;
    if (btn) btn.focus();
    if (window.AmuAnim) {
      window.AmuAnim.sheet(false, function () {
        sheet.hidden = true;
        backdrop.hidden = true;
      });
    } else {
      sheet.classList.remove('show');
      backdrop.classList.remove('show');
      setTimeout(function () {
        sheet.hidden = true;
        backdrop.hidden = true;
      }, 420);
    }
  }

  if (btn) btn.addEventListener('click', open);
  if (doneBtn) doneBtn.addEventListener('click', close);
  if (backdrop) backdrop.addEventListener('click', close);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet && !sheet.hidden) close();
  });

  if (motion.addEventListener) {
    motion.addEventListener('change', function () { apply(readSpeed()); });
  } else if (motion.addListener) {
    motion.addListener(function () { apply(readSpeed()); });
  }

  restoreAccent();
  sync();
})();
</script>

</body>
</html>
